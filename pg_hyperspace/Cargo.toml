[package]
name = "pg_hyperspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PostgreSQL extension for HyperspaceDB: Multi-Metric Vector Search (L2, Cosine, Dot, Poincaré, Lorentz, Wasserstein), Native KAG GraphRAG, and Tribunal Hallucination Router"

[lib]
crate-type = ["cdylib", "lib"]
doctest = false

[features]
default = ["pg17"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "=0.19.3"
pg_hyperspace-client = { path = "../pg_hyperspace-client" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
pgrx-tests = "=0.19.3"
